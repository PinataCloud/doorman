<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" width="900" height="316" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a Doorman rule</title>
  <desc id="desc">A custom rule in JSON. id names it in findings as custom:no-prod-apply. label is what the feed, a held call and Analytics show. severity says how loud the finding is. mode says what the guard does. when says which calls match; every clause must match. scope, optional, limits it to one directory.</desc>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #24292f; white-space: pre; }
    .key { fill: #0550ae; }
    .str { fill: #0a3069; }
    .opt { fill: #6e7781; }
    .note { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; }
    .name { font-weight: 600; }
    .sub { fill: #57606a; }
    .wire { stroke: #8c959f; stroke-width: 1; fill: none; }
    .dot { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .code, .note { fill: #e6edf3; }
      .key { fill: #79c0ff; }
      .str { fill: #a5d6ff; }
      .opt, .sub { fill: #8b949e; }
      .wire { stroke: #6e7681; }
      .dot { fill: #6e7681; }
    }
  </style>

  <rect class="box" x="12" y="12" width="478" height="290" rx="8"/>

  <text class="code" x="28" y="42">{</text>
  <text class="code" x="28" y="68">  <tspan class="key">"id"</tspan>: <tspan class="str">"no-prod-apply"</tspan>,</text>
  <text class="code" x="28" y="94">  <tspan class="key">"label"</tspan>: <tspan class="str">"kubectl apply against prod"</tspan>,</text>
  <text class="code" x="28" y="120">  <tspan class="key">"severity"</tspan>: <tspan class="str">"high"</tspan>,</text>
  <text class="code" x="28" y="146">  <tspan class="key">"mode"</tspan>: <tspan class="str">"ask"</tspan>,</text>
  <text class="code" x="28" y="172">  <tspan class="key">"when"</tspan>: {</text>
  <text class="code" x="28" y="198">    <tspan class="key">"command"</tspan>: <tspan class="str">"kubectl\\s+apply\\b.*--context[= ]prod"</tspan></text>
  <text class="code" x="28" y="224">  },</text>
  <text class="code opt" x="28" y="250">  "scope": { "cwd_prefix": "/Users/me/work/infra" }</text>
  <text class="code" x="28" y="276">}</text>

  <!-- id -->
  <circle class="dot" cx="490" cy="64" r="2.5"/>
  <path class="wire" d="M490 64 H520"/>
  <text class="note" x="528" y="68"><tspan class="name">id</tspan><tspan class="sub">  named custom:no-prod-apply in findings</tspan></text>

  <!-- label -->
  <circle class="dot" cx="490" cy="90" r="2.5"/>
  <path class="wire" d="M490 90 H520"/>
  <text class="note" x="528" y="94"><tspan class="name">label</tspan><tspan class="sub">  what the feed, a held call and Analytics show</tspan></text>

  <!-- severity -->
  <circle class="dot" cx="490" cy="116" r="2.5"/>
  <path class="wire" d="M490 116 H520"/>
  <text class="note" x="528" y="120"><tspan class="name">severity</tspan><tspan class="sub">  how loud: critical · high · medium · low</tspan></text>

  <!-- mode -->
  <circle class="dot" cx="490" cy="142" r="2.5"/>
  <path class="wire" d="M490 142 H520"/>
  <text class="note" x="528" y="146"><tspan class="name">mode</tspan><tspan class="sub">  what the guard does: observe · warn · ask · block</tspan></text>

  <!-- when: a bracket over its three lines -->
  <path class="wire" d="M498 166 H506 V222 H498"/>
  <path class="wire" d="M506 194 H520"/>
  <text class="note" x="528" y="190"><tspan class="name">when</tspan><tspan class="sub">  which calls match; every clause must match</tspan></text>
  <text class="note sub" x="528" y="209">clauses: tool · command · server · target · arg</text>

  <!-- scope -->
  <circle class="dot" cx="490" cy="246" r="2.5"/>
  <path class="wire" d="M490 246 H520"/>
  <text class="note" x="528" y="250"><tspan class="name">scope</tspan><tspan class="sub">  optional: only under this directory</tspan></text>
</svg>
